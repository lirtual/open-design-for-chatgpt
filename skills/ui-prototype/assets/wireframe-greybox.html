<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Low Fidelity Wireframe</title><style>
:root{--bg:#f7f8fb;--surface:#fff;--fg:#19202a;--muted:#515b69;--border:#cbd2dc;--accent:#174ea6}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--accent)}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button{font:inherit;cursor:pointer;background:var(--accent);color:white;border:0;border-radius:8px;padding:.75rem 1.2rem}
button:hover{filter:brightness(.93)}.container{max-width:1100px;margin:auto;padding:1.5rem}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}h1{font-size:clamp(2rem,5vw,3.7rem);line-height:1.12;letter-spacing:-.035em}h2{font-size:1.3rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){.grid{grid-template-columns:1fr}.container{padding:1rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><a class="sr-only" href="#main">Skip to content</a>
<style>:root{--bg:#f5f5f5;--surface:#ebebec;--fg:#282828;--muted:#505050;--border:#777;--accent:#6b3e3e}.wire{height:1.2rem;background:#d0d0d2;border-radius:0;margin:.5rem 0}.block{min-height:120px;border:2px dashed var(--border);display:grid;place-items:center}</style><header class="container"><strong>Structure-only wireframe</strong><span class="muted"> · Placeholder layout</span></header><main id="main" class="container"><h1>Page heading</h1><p>Structural prototype — brand decoration intentionally suppressed.</p><section class="grid" aria-label="Wireframe panels"><div class="card"><div class="wire" style="width:65%"></div><div class="wire" style="width:90%"></div><div class="block">Image placeholder</div></div><div class="card"><div class="wire" style="width:80%"></div><div class="wire" style="width:45%"></div><div class="block">Content placeholder</div></div><div class="card"><div class="wire" style="width:70%"></div><div class="wire" style="width:95%"></div><div class="block">Action placeholder</div></div></section></main>
</body></html>
